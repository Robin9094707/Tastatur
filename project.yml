name: Tastatur
options:
  bundleIdPrefix: de.tastatur
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  Tastatur:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    entitlements:
      path: App/Tastatur.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.tastatur.app
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Tastatur KI
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: de.tastatur.app
            CFBundleURLSchemes: [tastatur]
        CFBundleDevelopmentRegion: de
        NSContactsUsageDescription: Damit die Tastatur Namen aus deinen Kontakten kennt und Nummern/E-Mails vorschlagen kann. Alles bleibt auf deinem iPhone.
        NSLocationWhenInUseUsageDescription: Damit du deinen Standort mit einem Tipp aus der Tastatur senden kannst.
        NSCalendarsWriteOnlyAccessUsageDescription: Damit Termine, die du schreibst, mit einem Tipp im Kalender landen.
        NSCalendarsFullAccessUsageDescription: Damit Termine, die du schreibst, mit einem Tipp im Kalender landen.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.tastatur.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: TastaturKeyboard
        embed: true
  TastaturKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - Shared
    entitlements:
      path: Keyboard/TastaturKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.tastatur.app
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Tastatur KI
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: de
        NSLocationWhenInUseUsageDescription: Damit du deinen Standort mit einem Tipp aus der Tastatur senden kannst.
        NSCalendarsWriteOnlyAccessUsageDescription: Damit Termine, die du schreibst, mit einem Tipp im Kalender landen.
        NSCalendarsFullAccessUsageDescription: Damit Termine, die du schreibst, mit einem Tipp im Kalender landen.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: de-DE
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.tastatur.app.keyboard
        APPLICATION_EXTENSION_API_ONLY: "YES"
